name: kartu_profil
description: "Aplikasi Daftar Kontak dan Manajemen User API"
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Packages Praktikum Pertemuan 6
  convex_bottom_bar: ^3.2.0
  faker: ^2.2.0
  intl: 0.20.3
  dropdown_search: ^6.0.1
  avatar_glow: ^3.0.1

  # Package HTTP API
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true